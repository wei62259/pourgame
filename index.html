<style>
/* 單畫面手機遊戲：上方訂單貼紙，中間飲料機與杯子，下方一顆大按鈕 */
:root {
  --bg: #e6f0ec;
  --panel: #ffffff;
  --ink: #163631;
  --muted: #5b7871;
  --accent: #1d8468;
  --accent-ink: #ffffff;
  --mark: #e0457b;
  --gold: #e8a317;
  --glass: #163631;
  --machine: #c9dad4;
  --font-display: 'Huninn', 'Noto Sans TC', 'PingFang TC', sans-serif;
  --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1d1a; --panel: #172e29; --ink: #e2f1ec; --muted: #8eaea6;
    --accent: #3cc29e; --accent-ink: #052019; --mark: #ff6b9a; --gold: #ffc23d; --glass: #cfe8e1; --machine: #26443d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1d1a; --panel: #172e29; --ink: #e2f1ec; --muted: #8eaea6;
  --accent: #3cc29e; --accent-ink: #052019; --mark: #ff6b9a; --gold: #ffc23d; --glass: #cfe8e1; --machine: #26443d;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
.app {
  height: 100%; max-width: 460px; margin: 0 auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
.top { display: flex; align-items: center; gap: 10px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; margin: 0; letter-spacing: .04em; flex: 1; white-space: nowrap; }
.pips { display: flex; gap: 4px; }
.pip {
  width: 23px; height: 23px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-size: .62rem; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--muted); box-sizing: border-box;
}
.pip.now { border-color: var(--accent); color: var(--accent); }
.pip.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pip.zero { background: var(--mark); border-color: var(--mark); color: #fff; }
.pip.perfect { background: var(--gold); border-color: var(--gold); color: #2a1a00; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; flex: none; padding: 0;
}
.icon-btn:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.icon-btn svg { width: 18px; height: 18px; }

.ticket {
  background: var(--panel); border-radius: 4px; padding: 10px 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  border-left: 6px dashed var(--bg);
}
.ticket .no { font-size: .72rem; color: var(--muted); letter-spacing: .12em; }
.ticket .drink { font-family: var(--font-display); font-size: 1.35rem; }
.ticket .opts { font-size: .8rem; color: var(--muted); }
.ticket .note { font-size: .8rem; color: var(--mark); font-weight: 700; }
.ticket .target { grid-row: 1 / span 4; grid-column: 2; text-align: right; align-self: center; }
.ticket .target b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 2rem; color: var(--mark); font-variant-numeric: tabular-nums; line-height: 1; }
.ticket .target span { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }

.stage { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-size: .85rem; color: var(--muted); }
.combo {
  position: absolute; left: 0; top: 4px; font-family: var(--font-display); font-size: 1rem; color: var(--gold);
}
.result {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  background: var(--panel); border-radius: 14px; padding: 12px 18px; min-width: 230px; width: max-content; max-width: 100%; box-sizing: border-box;
  text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.15);
  animation: pop .25s ease-out;
}
.result .verdict { font-family: var(--font-display); font-size: 1.5rem; }
.result .detail { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.result .bonus { font-size: .85rem; color: var(--gold); font-weight: 700; margin-top: 2px; }
@keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }

.controls { display: flex; justify-content: center; padding-bottom: 4px; }
.btn {
  font-family: var(--font-display); font-size: 1.25rem; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border-radius: 999px;
  padding: 16px 0; width: min(100%, 300px);
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000);
  transition: transform .06s, box-shadow .06s;
}
.btn:active, .btn.held { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
.btn.secondary { background: var(--panel); color: var(--ink); box-shadow: 0 5px 0 var(--machine); }
.btn:disabled { opacity: .5; cursor: default; }

.final {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.card {
  background: var(--panel); border-radius: 18px; padding: 20px 18px; width: min(100%, 360px); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px; text-align: center; animation: pop2 .3s ease-out;
  margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,.18);
}
@keyframes pop2 { from { transform: scale(.94); opacity: 0; } }
.card .label { font-size: .75rem; letter-spacing: .14em; color: var(--muted); }
.card .total { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.card .total small { font-size: 1.1rem; color: var(--muted); }
.card .title { font-family: var(--font-display); font-size: 1.5rem; color: var(--mark); text-wrap: balance; }
.rows { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: .95rem; border-top: 1px solid var(--machine); padding-top: 12px; }
.rows div { display: grid; grid-template-columns: 1fr auto 3em; gap: 10px; font-variant-numeric: tabular-nums; }
.rows div span:nth-child(2) { color: var(--muted); }
.rows div span:last-child { text-align: right; font-weight: 700; }
.rows div.bonus-row span { color: var(--gold); }
.best { font-size: .8rem; color: var(--muted); }
.card .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.haptic { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.modes {
  justify-self: start; margin-top: 6px; display: inline-flex; border: 1.5px solid var(--muted); border-radius: 999px; overflow: hidden;
}
.modes button {
  font: inherit; font-size: .8rem; padding: 4px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.modes button:focus-visible { outline: 3px solid var(--mark); outline-offset: -3px; }
.copied { font-size: .8rem; color: var(--accent); min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { .result, .card { animation: none; } }
</style>

<div class="app">
  <div class="top">
    <h1>倒剛剛好</h1>
    <div class="pips" id="pips"></div>
    <button class="icon-btn" id="mute" type="button" aria-label="關閉音效"></button>
  </div>

  <div class="ticket">
    <div class="no" id="tNo">訂單 #001</div>
    <div class="drink" id="tDrink">紅茶</div>
    <div class="opts" id="tOpts">大杯 · 半糖少冰</div>
    <div class="note" id="tNote" hidden></div>
    <div class="modes" id="modes" role="group" aria-label="模式">
      <button type="button" data-mode="normal">一般模式</button>
      <button type="button" data-mode="blind">盲倒模式</button>
    </div>
    <div class="target"><b id="tTarget">300</b><span>ML</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">按住按鈕倒飲料，放開就停。只有一次機會！</div>
    <div class="combo" id="combo" hidden></div>
    <div class="result" id="result" hidden>
      <div class="verdict" id="rVerdict"></div>
      <div class="detail" id="rDetail"></div>
      <div class="bonus" id="rBonus" hidden></div>
    </div>
  </div>

  <label class="haptic" aria-hidden="true"><input type="checkbox" switch id="haptic" tabindex="-1"></label>
  <div class="controls">
    <button class="btn" id="pour" type="button">按住倒</button>
  </div>
</div>

  <div class="final" id="final" hidden>
    <div class="card">
      <div class="label" id="fLabel">總分</div>
      <div class="total"><span id="fTotal">0</span><small> / 500</small></div>
      <div class="title" id="fTitle"></div>
      <div class="rows" id="fRows"></div>
      <div class="best" id="fBest"></div>
      <div class="actions">
        <button class="btn" id="again" type="button">再玩一次</button>
        <button class="btn secondary" id="switchMode" type="button">換成盲倒模式</button>
        <button class="btn secondary" id="copy" type="button">複製成績</button>
        <div class="copied" id="copied"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const DRINKS = [
    { name: '紅茶', color: '#b4521a' }, { name: '茉莉綠茶', color: '#a7bd3d' }, { name: '烏龍茶', color: '#8a4b16' },
    { name: '鮮奶茶', color: '#cfa477' }, { name: '冬瓜茶', color: '#9c5a22' }, { name: '檸檬綠', color: '#d6cf35' },
    { name: '百香綠', color: '#e2a72c' }, { name: '葡萄柚綠', color: '#e2725b' }, { name: '黑糖鮮奶', color: '#a26a3c' },
    { name: '多多綠', color: '#c9d86a' }, { name: '可可', color: '#5e3520' }, { name: '芒果冰沙', color: '#f2a53a' },
    { name: '洛神花茶', color: '#a3203e' }, { name: '抹茶拿鐵', color: '#7fa650' }, { name: '青梅綠', color: '#b7c44a' },
  ];
  // 杯子越細，水位升得越快；容量不同，同樣的出水速度手感也不同
  const CUPS = [
    { label: '小杯', cap: 360, top: 190, bot: 405, topW: 172, botW: 128 },
    { label: '中杯', cap: 500, top: 120, bot: 405, topW: 200, botW: 150 },
    { label: '大杯', cap: 700, top: 72, bot: 405, topW: 216, botW: 152 },
    { label: '細長杯', cap: 450, top: 78, bot: 405, topW: 140, botW: 118 },
  ];
  const MODS = {
    accel: '越倒越快',
    pulse: '出水口忽大忽小',
    ice: '倒到一半會丟冰塊',
    pearls: '杯底先放了珍珠',
    foam: '先倒茶，再倒一層奶蓋',
    blind: '盲倒：開始倒就看不到線',
  };
  // 每杯的機關數量，越後面越多
  const MOD_COUNT = [0, 1, 1, 2, 3];
  const SUGAR = ['全糖', '少糖', '半糖', '微糖', '無糖'];
  const ICE = ['正常冰', '少冰', '微冰', '去冰'];

  function makePlan(g, blindAll) {
    const gr = (a, b) => a + g() * (b - a);
    const pick = arr => arr[Math.floor(g() * arr.length)];
    const drinks = DRINKS.slice();
    let foamUsed = false;
    return MOD_COUNT.map((n, idx) => {
      const d = drinks.splice(Math.floor(g() * drinks.length), 1)[0];
      const cup = idx === 0 ? CUPS[1] : pick(CUPS);
      const mods = new Set();
      while (mods.size < n) {
        const pool = Object.keys(MODS).filter(m => !mods.has(m)
          && !(m === 'foam' && (foamUsed || (!blindAll && mods.has('blind'))))
          && !(m === 'blind' && (blindAll || idx < 2 || mods.has('foam'))));
        if (!pool.length) break;
        mods.add(pick(pool));
      }
      if (mods.has('foam')) foamUsed = true;
      const mlRate = 95 + idx * 8 + gr(0, 20);
      const pearls = mods.has('pearls') ? gr(.12, .17) : 0;
      const lo = Math.max(.4, pearls + .3), hi = mods.has('foam') ? .58 : .8;
      const r = {
        name: (pearls ? '珍珠' : '') + d.name + (mods.has('foam') ? '奶蓋' : ''),
        cup, cap: cup.cap,
        rate: mlRate / cup.cap,
        accel: mods.has('accel') ? gr(.4, .65) : gr(0, .08 * idx),
        delay: gr(.3, .36),
        pulse: mods.has('pulse') ? { w: gr(4, 7), ph: gr(0, 6.28) } : null,
        pearls, blind: blindAll || mods.has('blind'),
        ice: mods.has('ice') ? { at: gr(.35, .55), vol: gr(40, 60) / cup.cap } : null,
        mods: [...mods],
        sugar: pick(SUGAR), iceText: mods.has('ice') ? '正常冰' : pick(ICE.slice(1)),
        stages: [{ color: d.color, target: gr(mods.has('foam') ? .42 : lo, hi) }],
      };
      if (mods.has('foam')) r.stages.push({ color: '#f1ebdc', foam: true, rate: 65 / cup.cap, accel: 0, delay: .28, above: gr(.12, .18) });
      return r;
    });
  }

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), pourBtn = $('pour');
  const rand = (a, b) => a + Math.random() * (b - a);
  const snap = (f, cap) => Math.round(f * cap / 5) * 5 / cap;
  // Android 用 vibrate；iPhone 不支援，改用點一下隱藏的 switch 觸發系統觸覺回饋（iOS 18 以上）
  const hapticLabel = document.querySelector('.haptic');
  const tap = () => { try { hapticLabel.click(); } catch (e) {} };
  const buzz = p => {
    try { if (navigator.vibrate) { navigator.vibrate(p); return; } } catch (e) {}
    const n = Array.isArray(p) ? Math.ceil(p.length / 2) : 1;
    for (let i = 0; i < n; i++) setTimeout(tap, i * 90);
  };

  // ---------- 音效 ----------
  const Sound = (() => {
    let ac = null, noiseBuf, filt, gain, muted = false;
    try { muted = localStorage.getItem('pour-mute') === '1'; } catch (e) {}
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ac = new AC();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        filt = ac.createBiquadFilter(); filt.type = 'bandpass'; filt.Q.value = 5;
        gain = ac.createGain(); gain.gain.value = 0;
        src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
        src.start();
      } catch (e) { ac = null; }
    }
    // 倒水聲：杯子越滿，聲音越高，跟真的裝水一樣
    function pour(on, lvl) {
      if (!ac) return;
      const t = ac.currentTime;
      gain.gain.setTargetAtTime(on && !muted ? 0.28 : 0, t, 0.05);
      filt.frequency.setTargetAtTime(280 + Math.min(lvl, 1.1) * 1700, t, 0.06);
    }
    function tone(freq, dur, type = 'sine', vol = 0.18, delay = 0) {
      if (!ac || muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function splash() {
      if (!ac || muted) return;
      const t = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      s.connect(f); f.connect(g); g.connect(ac.destination);
      s.start(t); s.stop(t + 0.75);
    }
    return {
      init, pour, tone, splash,
      get muted() { return muted; },
      set muted(v) {
        muted = v;
        try { localStorage.setItem('pour-mute', v ? '1' : '0'); } catch (e) {}
        if (v && gain) gain.gain.value = 0;
      },
    };
  })();
  const sfx = {
    perfect() { Sound.tone(784, .25, 'triangle'); Sound.tone(1047, .25, 'triangle', .18, .09); Sound.tone(1568, .45, 'triangle', .18, .18); },
    good() { Sound.tone(880, .3, 'triangle'); Sound.tone(1175, .35, 'triangle', .14, .08); },
    meh() { Sound.tone(523, .3, 'triangle'); },
    bad() { Sound.tone(196, .35, 'square', .08); Sound.tone(165, .4, 'square', .08, .12); },
    clink() { Sound.tone(2400 + Math.random() * 600, .09, 'sine', .12); Sound.tone(3600, .06, 'sine', .06, .02); },
    combo(n) { for (let i = 0; i < Math.min(n, 5); i++) Sound.tone(660 * Math.pow(1.12, i), .12, 'square', .05, .35 + i * .06); },
  };

  const SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
  function renderMute() {
    $('mute').innerHTML = Sound.muted ? SPEAKER_OFF : SPEAKER_ON;
    $('mute').setAttribute('aria-label', Sound.muted ? '開啟音效' : '關閉音效');
  }
  $('mute').addEventListener('click', () => { Sound.init(); Sound.muted = !Sound.muted; renderMute(); });
  renderMute();

  // ---------- 遊戲狀態 ----------
  const W = 320, H = 430;
  const NOZ_Y = 44;
  let CUP = CUPS[1];
  let ROUNDS = [];

  let round, stageIdx, results, tg, level, queue, state, pourT, releaseAt, agitation, lineAlpha;
  let bubbles = [], particles = [], floats = [], cubes = [];
  let stageEnds, iceAt, iceVol, iceDone, combo, orderNo, now = performance.now() / 1000;

  const R = () => ROUNDS[round];
  const S = () => R().stages[stageIdx];
  const P = k => (S()[k] !== undefined ? S()[k] : R()[k]);
  const curRate = () => {
    const pl = !S().foam && R().pulse;
    return P('rate') * (1 + P('accel') * pourT) * (pl ? 1 + 0.6 * Math.sin(pourT * pl.w + pl.ph) : 1);
  };

  let mode = 'normal';
  try { if (localStorage.getItem('pour-mode') === 'blind') mode = 'blind'; } catch (e) {}
  function setMode(m) {
    mode = m;
    try { localStorage.setItem('pour-mode', m); } catch (e) {}
    newGame();
  }
  function newGame() {
    ROUNDS = makePlan(Math.random, mode === 'blind');
    round = 0; results = []; combo = 0;
    tg = ROUNDS.map(r => r.stages.map(s => (s.foam ? null : snap(s.target, r.cap))));
    orderNo = Math.floor(rand(100, 900));
    $('final').hidden = true;
    startRound();
  }

  function startRound() {
    const r = R();
    CUP = r.cup;
    level = r.pearls || 0;
    stageEnds = []; cubes = []; bubbles = []; floats = []; particles = [];
    iceDone = !r.ice;
    if (r.ice) { iceAt = tg[round][0] * r.ice.at; iceVol = r.ice.vol; }
    results.push({ name: r.name, stages: [], score: 0, bonus: 0 });
    $('tNo').textContent = `${mode === 'blind' ? '盲倒模式' : '訂單 #' + String(orderNo + round).padStart(3, '0')} · 第 ${round + 1} / ${ROUNDS.length} 杯`;
    $('tOpts').textContent = `${r.cup.label} ${r.cap} ml · ${r.sugar}${r.iceText}`;
    const note = r.mods.filter(m => !(mode === 'blind' && m === 'blind')).map(m => m === 'ice' ? `${MODS.ice}（約 ${Math.round(iceVol * r.cap / 10) * 10} ml）` : MODS[m]).join('、');
    $('tNote').textContent = note; $('tNote').hidden = !note;
    $('hint').hidden = round > 0;
    $('hint').textContent = mode === 'blind' ? '盲倒模式：一按下去目標線就消失，記住位置！' : '按住按鈕倒飲料，放開就停。只有一次機會！';
    $('modes').hidden = round > 0;
    for (const b of $('modes').children) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    startStage(0);
  }

  function startStage(i) {
    stageIdx = i;
    if (tg[round][i] === null) {
      tg[round][i] = snap(Math.min(.95, level + S().above), R().cap);
    }
    queue = []; state = 'ready'; pourT = 0; agitation = 0; lineAlpha = 1;
    $('tDrink').textContent = R().stages.length > 1 ? `${R().name} · ${S().foam ? '倒奶蓋' : '先倒茶'}` : R().name;
    $('tTarget').textContent = Math.round(tg[round][i] * R().cap);
    $('result').hidden = true;
    pourBtn.textContent = '按住倒';
    pourBtn.disabled = false;
    renderPips(); renderCombo();
  }

  function renderPips() {
    $('pips').innerHTML = ROUNDS.map((_, i) => {
      const res = results[i];
      const done = res && (i < round || state === 'result' && stageIdx === ROUNDS[i].stages.length - 1 && i === round || state === 'final');
      if (done) {
        const cls = res.score === 0 ? 'zero' : res.score >= 96 ? 'perfect' : 'done';
        return `<div class="pip ${cls}">${res.score}</div>`;
      }
      return `<div class="pip ${i === round ? 'now' : ''}">${i + 1}</div>`;
    }).join('');
  }
  function renderCombo() {
    $('combo').hidden = combo < 2 || state === 'final';
    $('combo').textContent = `連擊 ×${combo}`;
  }

  function press() {
    Sound.init();
    if (state === 'ready') {
      state = 'pouring'; pourT = 0; tap();
      pourBtn.classList.add('held');
      $('hint').hidden = true;
      $('modes').hidden = true;
    } else if (state === 'result') {
      if (stageIdx < R().stages.length - 1) { startStage(stageIdx + 1); return; }
      if (round === ROUNDS.length - 1) showFinal();
      else { round++; startRound(); }
    }
  }
  function release() {
    pourBtn.classList.remove('held');
    if (state === 'pouring') { state = 'settling'; releaseAt = now; pourBtn.disabled = true; if (!navigator.vibrate) tap(); }
  }

  function finishStage() {
    const t = tg[round][stageIdx];
    const overflow = level > 1.0;
    const diffMl = Math.round(Math.abs(Math.min(level, 1) - t) * R().cap);
    const score = overflow ? 0 : Math.max(0, Math.round(100 - diffMl * 2));
    const res = results[round];
    res.stages.push({ diffMl, score, overflow, over: level > t });
    stageEnds.push(Math.min(level, 1));
    const last = stageIdx === R().stages.length - 1;

    let verdict;
    if (overflow) verdict = '滿出來了！';
    else if (diffMl <= 2) verdict = '完美一滴不差';
    else if (diffMl <= 8) verdict = '超準';
    else if (diffMl <= 20) verdict = '還不錯';
    else if (diffMl <= 40) verdict = '客人皺眉了';
    else verdict = '這杯要重做';
    $('rVerdict').textContent = verdict;
    $('rDetail').textContent = overflow
      ? '溢出杯子 · 0 分'
      : `倒到 ${Math.round(Math.min(level, 1) * R().cap)} ml · ${diffMl === 0 ? '剛好' : (level > t ? '多' : '少') + ' ' + diffMl + ' ml'} · ${score} 分`;

    // 特效
    const sy = yAt(Math.min(level, 1));
    if (overflow) { Sound.splash(); sfx.bad(); buzz([200, 80, 200]); shake(12, .6); flash('--mark', .5); addFloat('溢出！', 'mark'); }
    else if (diffMl <= 2) { sfx.perfect(); buzz([15, 50, 15, 50, 30]); shake(5, .25); flash('--gold'); burst(W / 2, sy, 46); addFloat('PERFECT!', 'gold'); }
    else if (diffMl <= 10) { sfx.good(); buzz(20); shake(2.5, .18); burst(W / 2, sy, 14); addFloat('很準！', 'accent'); }
    else if (diffMl <= 30) { sfx.meh(); }
    else { sfx.bad(); buzz([40, 60, 40]); shake(7, .4); }

    $('rBonus').hidden = true;
    if (last) {
      res.score = Math.round(res.stages.reduce((s, x) => s + x.score, 0) / res.stages.length);
      const clean = res.stages.every(x => !x.overflow && x.diffMl <= 10);
      combo = clean ? combo + 1 : 0;
      if (combo >= 2) {
        res.bonus = (combo - 1) * 10;
        $('rBonus').textContent = `連擊 ×${combo} · 加 ${res.bonus} 分`;
        $('rBonus').hidden = false;
        sfx.combo(combo); flash('--gold', .25);
      }
    }
    $('result').hidden = false;
    state = 'result';
    pourBtn.disabled = false;
    pourBtn.textContent = !last ? '倒奶蓋' : round === ROUNDS.length - 1 ? '看總分' : '下一杯';
    renderPips(); renderCombo();
  }

  function titleFor(total) {
    if (total >= 480) return '人形量杯';
    if (total >= 420) return '飲料店傳說店長';
    if (total >= 350) return '資深吧台手';
    if (total >= 260) return '穩定的工讀生';
    if (total >= 160) return '上班第一天';
    return '請離飲料機遠一點';
  }

  let lastShare = '';
  function showFinal() {
    const base = results.reduce((s, x) => s + x.score, 0);
    const bonus = results.reduce((s, x) => s + x.bonus, 0);
    const total = base + bonus;
    const title = titleFor(total);
    let best = 0;
    const bestKey = mode === 'blind' ? 'pour-best-blind' : 'pour-best-v4';
    try { best = Number(localStorage.getItem(bestKey)) || 0; if (total > best) localStorage.setItem(bestKey, String(total)); } catch (e) {}
    $('fLabel').textContent = mode === 'blind' ? '盲倒模式 · 總分' : '總分';
    $('switchMode').textContent = mode === 'blind' ? '換成一般模式' : '換成盲倒模式';
    $('fTotal').textContent = total;
    $('fTitle').textContent = title;
    const diffText = st => st.overflow ? '溢出' : st.diffMl === 0 ? '剛好' : (st.over ? '+' : '−') + st.diffMl;
    $('fRows').innerHTML = results.map(r =>
      `<div><span>${r.name}</span><span>${r.stages.map(diffText).join(' / ')} ml</span><span>${r.score}</span></div>`
    ).join('') + (bonus ? `<div class="bonus-row"><span>連擊加分</span><span></span><span>+${bonus}</span></div>` : '');
    $('fBest').textContent = total > best ? (best ? `新紀錄！之前最好 ${best} 分` : '') : `你的最佳紀錄 ${best} 分`;
    $('copied').textContent = '';
    lastShare = `我在「倒剛剛好」${mode === 'blind' ? '盲倒模式' : ''}拿到 ${total} 分，稱號：${title}\n` +
      results.map(r => (r.score >= 96 ? '🌟' : r.score >= 80 ? '🟢' : r.score >= 50 ? '🟡' : '🔴')).join('');
    state = 'final';
    $('result').hidden = true;
    $('final').hidden = false;
    $('final').scrollTop = 0;
    pourBtn.disabled = true;
    pourBtn.textContent = '按住倒';
    renderPips(); renderCombo();
    if (total >= 420) { sfx.perfect(); burst(W / 2, H / 2, 60); }
  }

  // ---------- 輸入 ----------
  pourBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { pourBtn.setPointerCapture(e.pointerId); } catch (err) {}
    press();
  });
  pourBtn.addEventListener('pointerup', release);
  pourBtn.addEventListener('pointercancel', release);
  pourBtn.addEventListener('lostpointercapture', release);
  pourBtn.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (e.target.closest && e.target.closest('#final, #mute, #modes')) return;
    e.preventDefault(); if (!e.repeat) press();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });
  window.addEventListener('blur', release);
  $('again').addEventListener('click', newGame);
  $('switchMode').addEventListener('click', () => setMode(mode === 'blind' ? 'normal' : 'blind'));
  $('modes').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b && state === 'ready' && round === 0 && b.dataset.mode !== mode) setMode(b.dataset.mode);
  });
  $('copy').addEventListener('click', () => {
    const done = () => { $('copied').textContent = '已複製，貼給朋友吧'; };
    const fallback = () => { $('copied').textContent = lastShare.split('\n')[0]; };
    try { navigator.clipboard.writeText(lastShare).then(done, fallback); } catch (e) { fallback(); }
  });

  // ---------- 特效 ----------
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(120, 340);
      particles.push({ x: x + rand(-40, 40), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.7, 1.3), age: 0,
        c: ['--gold', '--mark', '--accent'][i % 3], s: rand(3, 6), rot: rand(0, 6) });
    }
  }
  function addFloat(text, color) { floats.push({ text, color: '--' + color, age: 0 }); }
  let shakeAmp = 0, shakeLeft = 0, shakeDur = 1, flashColor = '', flashLeft = 0;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function shake(amp, dur) { if (reduceMotion) return; shakeAmp = amp; shakeLeft = shakeDur = dur; }
  function flash(color, dur = 0.35) { flashColor = color; flashLeft = dur; }

  // ---------- 杯子幾何 ----------
  let scale = 1, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const w = stage.clientWidth, h = stage.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    scale = Math.min(w / W, h / H);
    ox = (w - W * scale) / 2; oy = (h - H * scale) / 2;
  }
  new ResizeObserver(resize).observe(stage);

  const yAt = f => CUP.bot - f * (CUP.bot - CUP.top);
  const halfAt = y => (CUP.botW + (CUP.topW - CUP.botW) * ((CUP.bot - y) / (CUP.bot - CUP.top))) / 2;
  function cupPath() {
    const cx = W / 2;
    ctx.beginPath();
    ctx.moveTo(cx - CUP.topW / 2, CUP.top);
    ctx.lineTo(cx - CUP.botW / 2 + 6, CUP.bot);
    ctx.quadraticCurveTo(cx - CUP.botW / 2 + 6, CUP.bot + 8, cx - CUP.botW / 2 + 16, CUP.bot + 8);
    ctx.lineTo(cx + CUP.botW / 2 - 16, CUP.bot + 8);
    ctx.quadraticCurveTo(cx + CUP.botW / 2 - 6, CUP.bot + 8, cx + CUP.botW / 2 - 6, CUP.bot);
    ctx.lineTo(cx + CUP.topW / 2, CUP.top);
  }
  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ---------- 繪圖 ----------
  function draw(t) {
    const css = getComputedStyle(document.documentElement);
    const C = k => css.getPropertyValue(k).trim();
    const r = R(), cx = W / 2;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    const k = shakeLeft > 0 ? shakeLeft / shakeDur : 0;
    const sx = (Math.random() * 2 - 1) * shakeAmp * k, sy0 = (Math.random() * 2 - 1) * shakeAmp * k;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx * scale), dpr * (oy + sy0 * scale));

    // 飲料機
    ctx.fillStyle = C('--machine');
    roundedRect(cx - 70, -20, 140, 44, 10); ctx.fill();
    roundedRect(cx - 14, 14, 28, NOZ_Y - 14, 5); ctx.fill();
    ctx.fillStyle = state === 'pouring' ? S().color : C('--muted');
    ctx.beginPath(); ctx.arc(cx + 48, 2, 5, 0, Math.PI * 2); ctx.fill();

    const vis = Math.min(level, 1.0);
    const surf = yAt(vis);

    // 水柱
    if (state === 'pouring' || queue.length > 0) {
      const delay = P('delay'), fall = surf - NOZ_Y;
      let top = NOZ_Y, bottom = surf;
      if (state === 'pouring' && pourT < delay) bottom = NOZ_Y + fall * (pourT / delay);
      if (state !== 'pouring') top = NOZ_Y + fall * Math.min(1, (now - releaseAt) / delay);
      const sw = 4 + curRate() * R().cap * 0.05;
      ctx.fillStyle = S().color;
      ctx.fillRect(cx - sw / 2, top, sw, Math.max(0, bottom - top));
    }

    // 杯內液體，一層一層畫
    ctx.save();
    cupPath(); ctx.closePath(); ctx.clip();
    const amp = 1.2 + agitation * 3.5;
    const wave = x => surf + Math.sin(x / 14 + t * 6) * amp + Math.sin(x / 7 - t * 9) * amp * 0.4;
    for (let s = 0; s <= stageIdx; s++) {
      const fromF = s === 0 ? 0 : stageEnds[s - 1];
      const toF = s < stageEnds.length && s < stageIdx ? stageEnds[s] : level;
      if (toF <= fromF + 0.0005 && s > 0) continue;
      const yb = s === 0 ? CUP.bot + 20 : yAt(fromF);
      ctx.fillStyle = r.stages[s].color;
      ctx.beginPath();
      ctx.moveTo(cx - 130, yb);
      if (s === stageIdx) for (let x = -130; x <= 130; x += 6) ctx.lineTo(cx + x, wave(x));
      else { ctx.lineTo(cx - 130, yAt(toF)); ctx.lineTo(cx + 130, yAt(toF)); }
      ctx.lineTo(cx + 130, yb);
      ctx.fill();
      if (r.stages[s].foam) {
        ctx.fillStyle = 'rgba(0,0,0,.05)';
        for (let i = 0; i < 26; i++) {
          const fy = yAt(fromF) - ((i * 41) % 100) / 100 * (yAt(fromF) - surf);
          ctx.beginPath(); ctx.arc(cx + (((i * 67) % 100) / 50 - 1) * (halfAt(fy) - 6), fy, 2.5, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    if (level > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillRect(cx - 130, surf - 1, 260, 5);
    }
    if (r.pearls) {
      const pt = yAt(r.pearls);
      for (const pass of [0, 1]) {
        ctx.fillStyle = pass ? 'rgba(255,255,255,.25)' : '#2b1a12';
        for (let i = 0; i < 42; i++) {
          const py = CUP.bot + 2 - ((i * 37) % 100) / 100 * (CUP.bot - pt);
          const px = cx + (((i * 53) % 100) / 50 - 1) * (halfAt(py) - 10);
          ctx.beginPath();
          if (pass) ctx.arc(px - 2.2, py - 2.2, 1.8, 0, Math.PI * 2); else ctx.arc(px, py, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();

    // 冰塊
    for (const c of cubes) {
      ctx.save();
      ctx.translate(c.x, c.landed ? surf - 4 + Math.sin(t * 3 + c.x) * 2 : c.y);
      ctx.rotate(c.rot + (c.landed ? Math.sin(t * 2 + c.x) * 0.08 : 0));
      ctx.fillStyle = 'rgba(225,245,255,.78)';
      ctx.strokeStyle = 'rgba(120,170,190,.9)'; ctx.lineWidth = 1.5;
      roundedRect(-c.s / 2, -c.s / 2, c.s, c.s, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillRect(-c.s / 2 + 4, -c.s / 2 + 4, c.s * 0.3, 3);
      ctx.restore();
    }

    // 溢出
    if (level > 1.0) {
      ctx.fillStyle = S().color;
      const spill = Math.min(1, (level - 1) * 12);
      for (const sd of [-1, 1]) {
        const ex = cx + sd * CUP.topW / 2;
        ctx.beginPath();
        ctx.moveTo(ex - 4 * sd, CUP.top - 2);
        ctx.quadraticCurveTo(ex + 6 * sd, CUP.top + 4, ex + 3 * sd, CUP.top + 20 + spill * 220);
        ctx.lineTo(ex - 3 * sd, CUP.top + 20 + spill * 220);
        ctx.lineTo(ex - 2 * sd, CUP.top + 4);
        ctx.fill();
      }
      ctx.beginPath(); ctx.ellipse(cx, CUP.bot + 14, 90 + spill * 50, 5 + spill * 4, 0, 0, Math.PI * 2); ctx.fill();
    }

    // 杯身
    ctx.strokeStyle = C('--glass'); ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.85; ctx.lineWidth = 3; cupPath(); ctx.stroke();
    ctx.globalAlpha = 0.15; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(cx - CUP.topW / 2 + 16, CUP.top + 14); ctx.lineTo(cx - CUP.botW / 2 + 18, CUP.bot - 18); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - CUP.topW / 2 - 6, CUP.top); ctx.lineTo(cx + CUP.topW / 2 + 6, CUP.top); ctx.stroke();

    // 目標線
    const target = tg[round][stageIdx];
    const ty = yAt(target);
    const showLine = state === 'result' || state === 'final' ? 1 : (r.blind ? lineAlpha : 1);
    if (showLine > 0.01) {
      ctx.globalAlpha = showLine;
      ctx.strokeStyle = C('--mark'); ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
      const hw = halfAt(ty);
      ctx.beginPath(); ctx.moveTo(cx - hw - 10, ty); ctx.lineTo(cx + hw + 10, ty); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = C('--mark');
      ctx.font = '15px Huninn, "Noto Sans TC", sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`${Math.round(target * r.cap)}`, cx + hw + 14, ty);
      ctx.beginPath(); ctx.moveTo(cx - hw - 10, ty); ctx.lineTo(cx - hw - 20, ty - 6); ctx.lineTo(cx - hw - 20, ty + 6); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 結果：差距括號
    if (state === 'result' && level <= 1.0) {
      const sy = yAt(level), hw = Math.max(halfAt(sy), halfAt(ty));
      ctx.strokeStyle = C('--ink'); ctx.fillStyle = C('--ink'); ctx.lineWidth = 1.5;
      const bx = cx - hw - 34;
      ctx.beginPath(); ctx.moveTo(bx + 6, sy); ctx.lineTo(bx, sy); ctx.lineTo(bx, ty); ctx.lineTo(bx + 6, ty); ctx.stroke();
      ctx.font = '13px "Noto Sans TC", sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const d = Math.round(Math.abs(level - target) * r.cap);
      ctx.fillText(d === 0 ? '0' : (level > target ? '+' : '−') + d, bx - 4, (sy + ty) / 2);
    }
    ctx.fillStyle = C('--muted'); ctx.font = '12px "Noto Sans TC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${r.cup.label} ${r.cap} ml`, cx, CUP.bot + 26);

    // 碎紙花
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.age * 8);
      ctx.fillStyle = C(p.c);
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    // 大字
    for (const f of floats) {
      const k = Math.min(1, f.age / 0.18);
      const sc = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3)) + (k === 1 ? Math.sin(Math.min(f.age - .18, .3) * 10) * 0.04 : 0);
      ctx.save();
      ctx.globalAlpha = f.age > 1.1 ? Math.max(0, 1 - (f.age - 1.1) / 0.4) : 1;
      ctx.translate(cx, CUP.top - 36 - f.age * 6); ctx.scale(sc, sc);
      ctx.font = '36px Huninn, "Noto Sans TC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = C('--bg'); ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = C(f.color); ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    if (flashLeft > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = Math.min(1, flashLeft / 0.35) * 0.28;
      ctx.fillStyle = C(flashColor);
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 邏輯：用真實時間推進，畫面卡頓也不會停 ----------
  function step(dt) {
    if (state === 'pouring') {
      const rate = curRate();
      pourT += dt;
      queue.push({ at: now + P('delay'), v: rate * dt });
      if (R().blind) lineAlpha = Math.max(0, lineAlpha - dt * 2.5);
      if (level > 1.12 || pourT > 12) release();
      if (!iceDone && level >= iceAt) {
        iceDone = true;
        for (let i = 0; i < 3; i++) {
          cubes.push({ x: W / 2 + (i - 1) * 46 + rand(-6, 6), y: CUP.top - 70 - i * 34, vy: 0, s: rand(26, 32), rot: rand(-.4, .4), landed: false, vol: iceVol / 3 });
        }
      }
    }
    while (queue.length && queue[0].at <= now) { level += queue.shift().v; agitation = Math.min(1, agitation + dt * 4); }
    agitation = Math.max(0, agitation - dt * 1.4);

    const surf = yAt(Math.min(level, 1));
    for (const c of cubes) {
      if (c.landed) continue;
      c.vy += 1100 * dt; c.y += c.vy * dt; c.rot += dt * 2;
      if (c.y >= surf - 4) {
        c.landed = true; level += c.vol; agitation = 1;
        sfx.clink(); buzz(12); shake(3.5, .18);
        for (let i = 0; i < 6; i++) particles.push({ x: c.x, y: surf, vx: rand(-90, 90), vy: rand(-220, -90), life: .5, age: 0, c: '--glass', s: 3, rot: 0 });
      }
    }

    if (state === 'pouring' || queue.length) {
      if (Math.random() < 0.5 && level > 0.04) {
        const y = surf + rand(20, 80);
        if (y < CUP.bot) bubbles.push({ x: W / 2 + rand(-12, 12), y, r: rand(1.2, 3), v: rand(30, 70) });
      }
    }
    for (const b of bubbles) { b.y -= b.v * dt; b.x += Math.sin(b.y / 8) * 0.3; }
    bubbles = bubbles.filter(b => b.y > surf + 3);
    for (const p of particles) { p.age += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.age < p.life);
    for (const f of floats) f.age += dt;
    shakeLeft = Math.max(0, shakeLeft - dt); flashLeft = Math.max(0, flashLeft - dt);
    floats = floats.filter(f => f.age < 1.5);

    if (state === 'settling' && !queue.length && cubes.every(c => c.landed) && now - releaseAt > P('delay') + 0.45) finishStage();
  }

  let last = now;
  function tick() {
    const t = performance.now() / 1000;
    let left = Math.min(2, t - last);
    last = t;
    now = t - left;
    while (left > 0) {
      const dt = Math.min(1 / 60, left);
      now += dt; left -= dt;
      step(dt);
    }
    now = t;
    Sound.pour(state === 'pouring' || queue.length > 0, level);
  }
  function frame() {
    try { tick(); draw(now); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  setInterval(tick, 50);

  newGame();
  resize();
  requestAnimationFrame(frame);
})();
</script>
