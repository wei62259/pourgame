<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body {
  background: #e6f0ec; color: #163631; font-family: 'Noto Sans TC', sans-serif; position: relative;
  background-image: radial-gradient(#c9dad4 2.5px, transparent 2.5px); background-size: 34px 34px;
}
.blob { position: absolute; right: -120px; top: -100px; width: 760px; height: 920px; border-radius: 50%; background: #d3e6df; }
.left { position: absolute; left: 92px; top: 0; bottom: 0; width: 680px; display: flex; flex-direction: column; justify-content: center; }
.kicker { display: inline-flex; align-self: flex-start; gap: 10px; align-items: center; background: #163631; color: #fff;
  font-weight: 700; font-size: 22px; padding: 9px 20px; border-radius: 999px; letter-spacing: .06em; }
.kicker i { width: 10px; height: 10px; border-radius: 50%; background: #e0457b; display: block; }
h1 { font-family: 'Huninn', sans-serif; font-weight: 400; font-size: 132px; line-height: 1; margin: 34px 0 26px; white-space: nowrap; letter-spacing: .02em; }
h1 em { font-style: normal; color: #1d8468; position: relative; }
h1 em::after { content: ''; position: absolute; left: -6px; right: -6px; bottom: -8px; border-top: 7px dashed #e0457b; }
.sub { font-size: 36px; font-weight: 700; margin: 0 0 40px; }
.sub b { color: #e0457b; }
.chips { display: flex; gap: 14px; flex-wrap: wrap; }
.chip { background: #fff; border-radius: 16px; padding: 14px 22px; font-size: 24px; font-weight: 700; box-shadow: 0 3px 0 #c9dad4; }
.chip.new { background: #e0457b; color: #fff; box-shadow: 0 3px 0 #b02d5d; }
.art { position: absolute; right: 70px; top: 0; width: 520px; height: 720px; }
</style></head>
<body>
<div class="blob"></div>
<div class="left">
  <span class="kicker"><i></i>一隻手指就能玩的手機小遊戲</span>
  <h1>倒剛<em>剛好</em></h1>
  <p class="sub">按住倒，放開停，<b>差 1ml 都算分</b></p>
  <div class="chips">
    <span class="chip">每局 5 杯 · 滿分 500</span>
    <span class="chip">冰塊、珍珠、奶蓋</span>
    <span class="chip new">盲倒模式</span>
  </div>
</div>
<svg class="art" viewBox="0 0 520 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 出水機 -->
  <rect x="120" y="-20" width="280" height="140" rx="26" fill="#c9dad4"/>
  <rect x="150" y="30" width="120" height="44" rx="12" fill="#163631"/>
  <text x="210" y="61" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="26" fill="#3cc29e">480ml</text>
  <circle cx="330" cy="52" r="20" fill="#e0457b"/>
  <rect x="236" y="118" width="48" height="34" rx="8" fill="#163631"/>
  <!-- 水柱 -->
  <!-- 杯子 -->
  <defs><clipPath id="cup"><path d="M120 250 H400 L370 660 H150 Z"/></clipPath></defs>
  <g clip-path="url(#cup)">
    <rect x="100" y="250" width="320" height="420" fill="#ffffff" opacity=".85"/>
    <rect x="100" y="440" width="320" height="240" fill="#cfa477"/>
    <path d="M100 440 Q160 428 220 440 T340 440 T460 440 V460 H100Z" fill="#dcb68d"/>
    <circle cx="190" cy="625" r="15" fill="#3b2418"/><circle cx="228" cy="636" r="15" fill="#3b2418"/>
    <circle cx="268" cy="628" r="15" fill="#3b2418"/><circle cx="306" cy="638" r="15" fill="#3b2418"/>
    <circle cx="340" cy="624" r="15" fill="#3b2418"/><circle cx="246" cy="604" r="15" fill="#3b2418"/>
    <circle cx="210" cy="600" r="15" fill="#3b2418"/><circle cx="288" cy="603" r="15" fill="#3b2418"/>
    <rect x="300" y="470" width="44" height="44" rx="8" fill="#fff" opacity=".55" transform="rotate(14 322 492)"/>
    <rect x="170" y="490" width="40" height="40" rx="8" fill="#fff" opacity=".5" transform="rotate(-10 190 510)"/>
  </g>
  <path d="M120 250 H400 L370 660 H150 Z" fill="none" stroke="#163631" stroke-width="8" stroke-linejoin="round"/>
  <rect x="250" y="152" width="20" height="292" rx="10" fill="#cfa477"/>
  <!-- 目標線 -->
  <line x1="96" y1="432" x2="424" y2="432" stroke="#e0457b" stroke-width="7" stroke-dasharray="20 12" stroke-linecap="round"/>
  <g transform="translate(424 410)">
    <rect width="92" height="44" rx="12" fill="#e0457b"/>
    <text x="46" y="31" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="24" fill="#fff">480</text>
  </g>
  <!-- 分數貼紙 -->
  <g transform="translate(96 236) rotate(-10)">
    <circle r="74" fill="#e8a317"/>
    <circle r="62" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/>
    <text y="-4" text-anchor="middle" font-family="Huninn" font-size="54" fill="#fff">100</text>
    <text y="32" text-anchor="middle" font-family="Noto Sans TC" font-weight="900" font-size="24" fill="#fff">完美！</text>
  </g>
</svg>
</body></html>
